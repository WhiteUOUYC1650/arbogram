
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js Web App
        run: npm run static
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Initialize Capacitor Android
        run: |
          # Если папка android или файл gradlew отсутствуют, пересоздаем платформу
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            echo "Android platform missing or incomplete. Adding..."
            rm -rf android
            npx cap add android
          fi

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Fix Kotlin dependency conflict
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"/implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"/g' android/app/build.gradle || true
          fi

      - name: Make gradlew executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          else
            echo "Error: android/gradlew not found!"
            exit 1
          fi

      - name: Build with Gradle
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: covechat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
