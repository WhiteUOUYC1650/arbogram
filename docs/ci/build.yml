name: Build Android APK (SLink)

# Раньше воркфлоу запускался ТОЛЬКО на push в main, поэтому сборки
# с рабочих веток (например cline/*) не стартовали вообще.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Capacitor 6 использует AGP 8.2 / Gradle 8.2, который не поддерживает JDK 21.
      # Именно из-за JDK 21 шаг `./gradlew assembleDebug` падал без внятной ошибки.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Check Firebase env
        run: |
          # GitHub подставляет пустую строку, если секрет не создан.
          # config.ts трактует пустые значения как «не задано» и берёт дефолты.
          for name in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_APP_ID; do
            current="${!name}"
            if [ -z "$current" ]; then
              echo "::warning::$name не задан — будет использован проект по умолчанию из src/firebase/config.ts"
            fi
          done
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Build web app (static export)
        run: npm run static
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Init Capacitor Android platform
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Android platform missing or incomplete — recreating"
            rm -rf android
            npx cap add android
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Ensure microphone permissions in Android manifest
        run: node scripts/patch-android-permissions.mjs

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify microphone permission in merged manifest
        working-directory: android
        run: |
          MANIFEST=$(find app/build/intermediates -path "*merged_manifests*debug*AndroidManifest.xml" | head -1)
          echo "merged manifest: $MANIFEST"
          if [ -z "$MANIFEST" ] || ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            echo "::error::RECORD_AUDIO отсутствует в итоговом манифесте — голосовые не запишутся"
            exit 1
          fi
          echo "RECORD_AUDIO на месте ✅"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            android/build/reports/**
            android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
